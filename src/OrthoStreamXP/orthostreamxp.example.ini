# OrthoStreamXP settings
#
# The OrthoStreamXP window (double-click orthostreamxp.exe) writes orthostreamxp.ini for you. To write it by hand,
# copy this file to "orthostreamxp.ini" next to orthostreamxp.exe and edit it.
#
#   name = value         the option names, without the dashes
#   flags                true or false
#   paths                as they are, no quotes or doubled backslashes needed
#   empty value          the setting is not used (same as leaving the line out)
#   # or ;               comment

# --- Where things live -------------------------------------------------------------
# the folder of base packages: every subfolder with Earth nav data is mounted as Custom Scenery\<its name>
base-packages      = D:\OrthoStreamXP\Base Packages
# the X-Plane folder; the mounted packages are moved to the end of Custom Scenery\scenery_packs.ini (on or off)
xplane             = C:\X-Plane 12
scenery-packs      = on
# added to X-Plane's command line when OrthoStreamXP starts it, such as --allow_reshade (empty: none)
xplane-arguments   =
# one folder for every config: each level and texture size keeps its textures in its own subfolder
# (cache\Balanced_1024-1024\<package name>), so switching configs never rebuilds or mixes them
cache              = D:\OrthoStreamXP\Cache
# the most the textures in the cache may take, in GB (empty: no limit): when over it, the areas flown longest ago
# are removed as OrthoStreamXP starts or stops, down to 90%; the low-zoom base, the land cover and the logs stay
cache-limit        =
lazy-texture-store =
# none, console, log-file or both
log-output         = both
# empty: one log per session in %LOCALAPPDATA%\OrthoStreamXP\logs (the last 10 kept)
log-file           =
# also log every file X-Plane asks for and every texture built, to find a problem (on or off; the log grows a lot)
log-detail         = off

# --- Where the pictures come from -------------------------------------------------
# bing, esri, or several tried in order for each tile: a tile the first lacks comes from the next
texture-provider   = bing,esri
texture-url        =
# ZL18 textures use zoom 18 + level, ZL16 textures 16 + (level + 1) up to level 0 (16 + level above): at -2, 16 and 64 tiles; at -1, 64 and 256
# the level also sets the texture size: 4096 px at level 0 and above, half per level below
level-change       = -2

# --- How fast it builds -----------------------------------------------------------
download-workers   = 128
dds-build-workers  = 16
encoder-workers    = 4
# seconds one tile request may take before it is retried on another server
download-timeout   = 5
# tries per tile before its texture fails
download-attempts  = 4
# threads answering X-Plane's file requests; one waits per texture being built for X-Plane
filesystem-threads = 64

# --- Faster cold start ------------------------------------------------------------
# serve textures level by level at the detail X-Plane needs (on or off): far scenery gets one small
# picture per texture at once, and nearer scenery waits for its detail: while a flight starts or X-Plane
# loads another place up to near-wait seconds, in flight max-wait at most
mip-streaming        = on
near-wait            = 60
max-wait             = 6
# MB the builds may hold at once, each at its own size (19 MB at 2048 px, 75 MB at 4096 px)
build-memory         = 512
# tiles the builds may download at once: keeps the sharpest textures from filling the connection
build-tiles          = 32768
# provisional-lod and provisional-wait are used only with mip-streaming off:
provisional-lod      = 0
provisional-wait     = 2
lazy-terrain-listing = true
# 0-100: how strong X-Plane's detail decals are on the photos. The packages' terrain definitions name a decal library
# that sprinkles procedural grass and dirt over the ground up close. It suits X-Plane's own land-class textures but
# looks like noise on aerial photos: 0 leaves it out, 100 keeps it as the packages define, between fades it.
# The packages' files are not changed
ground-detail        = 0
# light the towns on the photo tiles at night: street lamps and lit windows along X-Plane's roads, read from the
# overlay packages, painted once per tile and kept in the cache (on or off)
night-lights         = off
# at night in X-Plane download no detailed photos: the ground under the lights is the blurry low-zoom base, what is
# already cached is shown as it is, and from dusk on the photos stream again (on or off; needs mip-streaming)
skip-photos-at-night = off
# how far below the horizon the sun must be before the photos are skipped, in degrees (0-18): 6 is the end of civil
# twilight, 12 of nautical twilight; higher keeps the photos longer at dusk and brings them back sooner at dawn
skip-photos-sun-below = 9

# --- Building ahead of X-Plane ----------------------------------------------------
# build each DSF's textures as soon as X-Plane starts loading it, before it asks for them (on or off)
prefetch-loaded-scenery   = on
# SimBrief username (or numeric Pilot ID): when streaming starts, the photos around the departure airport of your
# latest SimBrief flight plan are built before X-Plane loads them; while the aircraft stands at the gate, the arrival
# and the climb follow. What the cache has already is skipped (empty: off)
# simbrief-user           = yourname
# with mip streaming off: how far around the departure airport, at full detail, 1-50 km
# simbrief-radius-km      = 10
# the most the SimBrief prefetch may download per streaming session, in MB; the rest is left to load-ahead (0: no limit)
# simbrief-download-limit = 1000
# while the aircraft stands at the gate, build the alternate airport's scenery too (rarely flown: off by default)
# simbrief-alternate      = off

# --- Following the aircraft -------------------------------------------------------
track-aircraft            = true
# OrthoStreamXP asks X-Plane (on this PC) for the aircraft position itself: no IP or port to set here or in X-Plane.
# width either side of the predicted path (and the circle when slow or stationary)
prefetch-radius-km        = 8
# how far ahead to prefetch, as flying time at the current ground speed
prefetch-lookahead-seconds = 120
prefetch-textures         = 24

# --- Paging model (mip streaming) -------------------------------------------------
# which mip level X-Plane wants at which distance: auto guesses from the screen and the flight tuning measures it
paging-k                  = auto
# log every read X-Plane makes and the camera position as CSV files in the logs folder, for finding a problem (on or off;
# the flight tuning measures the paging model without them)
read-log                  = off

# --- Colours ----------------------------------------------------------------------
# even out the colours of photos from different captures (on or off): a grey, hazy capture next to a bright, green
# one is moved towards the colours usual in the area, place by place, against the low-zoom base (brightness and tint
# only). Needs mip streaming; the cache keeps the photos as downloaded
match-colours             = off
# 0-100: how much of each correction is made
match-strength            = 100

# --- Seasons ----------------------------------------------------------------------
# colour the photos for the season of X-Plane's date and the place (on or off): autumn leaves, bare trees and
# resting fields in winter, fresh green in spring; conifers, roofs, roads and water stay. The cache keeps the photos
# as downloaded, so changing these never downloads them again
seasons                   = off
# auto, or early-spring, spring, summer, early-autumn, autumn, late-autumn or winter everywhere
season                    = auto
# 0-100: how far the colours move towards the season
season-strength           = 80

# --- Exposure ---------------------------------------------------------------------
# 50-100: how much light the photos let through; less darkens them evenly, as a camera's exposure, where they look
# brighter than X-Plane's own scenery. The cache keeps the photos as downloaded
exposure                  = 100
